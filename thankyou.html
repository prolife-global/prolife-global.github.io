<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>感謝您的訂購 | Thank You</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    .order-ref{font-weight:700;color:#0f4f3a}
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex align-items-start">
          <div class="me-3 text-success fs-1">✔</div>
          <div>
            <h4 class="mb-1">訂單已提交 · Order placed</h4>
            <div>編號 Ref: <span id="ref" class="order-ref"></span></div>
          </div>
        </div>
        <hr>
        <p class="mb-2">您可以：</p>
        <ul class="mb-3">
          <li>列印此頁作紀錄 Print this page</li>
          <li>如有需要，請聯絡我們 We’ll contact you to confirm shipping.</li>
        </ul>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" onclick="window.print()">列印 Print</button>
          <a class="btn btn-success" href="index.html#products">繼續選購 Continue shopping</a>
        </div>
      </div>
    </div>
  </div>

  <!-- OPTIONAL EmailJS (remove this block if you don’t want auto emails) -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
  (function(){
    // (1) Try to read the last order
    const order = (()=>{ try { return JSON.parse(localStorage.getItem('prolife_last_order')||'null'); } catch(e){ return null; } })();
    if (order?.ref) document.getElementById('ref').textContent = order.ref;

    // Build a plain-text summary
    function formatSummary(o){
      if (!o) return '';
      const lines = (o.items||[]).map(x=>`• ${x.name} x${x.qty} @ HK$ ${Number(x.price).toFixed(2)} = HK$ ${(x.qty*x.price).toFixed(2)}`);
      return [
        `Ref: ${o.ref}`,
        `Subtotal: HK$ ${(o.subtotal||0).toFixed(2)}`,
        '',
        'Items:',
        ...lines,
        '',
        'Customer:',
        `Name: ${o.customer?.name||''}`,
        `Phone: ${o.customer?.phone||''}`,
        o.customer?.email ? `Email: ${o.customer.email}` : '',
        o.customer?.address ? `Address: ${o.customer.address}` : '',
        o.customer?.notes ? `Notes: ${o.customer.notes}` : '',
        '',
        'Payment: PayPal (check transaction in PayPal Activity)'
      ].filter(Boolean).join('\n');
    }

    // (2) Send emails via EmailJS if configured, else mailto fallback
    const SUMMARY = formatSummary(order);
    const BUSINESS_EMAIL = 'prolifewilson@gmail.com';

    // --- EmailJS OPTIONAL SETUP ---
    // Replace with your IDs to enable auto emails; else it will fall back to mailto
    const EMAILJS_PUBLIC_KEY = 'YOUR_PUBLIC_KEY';
    const SERVICE_ID_BUSINESS = 'YOUR_SERVICE_ID';
    const TEMPLATE_ID_BUSINESS = 'YOUR_BUSINESS_TEMPLATE_ID';
    const SERVICE_ID_CUSTOMER = 'YOUR_SERVICE_ID';
    const TEMPLATE_ID_CUSTOMER = 'YOUR_CUSTOMER_TEMPLATE_ID';

    function emailjsEnabled(){
      return window.emailjs && EMAILJS_PUBLIC_KEY !== 'YOUR_PUBLIC_KEY';
    }

    async function sendEmails(){
      if (!emailjsEnabled()) throw new Error('EmailJS not configured');

      emailjs.init(EMAILJS_PUBLIC_KEY);

      // Business notification
      await emailjs.send(SERVICE_ID_BUSINESS, TEMPLATE_ID_BUSINESS, {
        to_email: BUSINESS_EMAIL,
        order_ref: order.ref,
        order_summary: SUMMARY
      });

      // Customer confirmation
      if (order.customer?.email){
        await emailjs.send(SERVICE_ID_CUSTOMER, TEMPLATE_ID_CUSTOMER, {
          to_email: order.customer.email,
          order_ref: order.ref,
          order_summary: SUMMARY
        });
      }
    }

    (async ()=>{
      try {
        await sendEmails();
      } catch(e){
        // Fallback: open a mailto draft to the business (user can hit Send)
        const subject = encodeURIComponent('New order ' + (order?.ref||''));
        const body    = encodeURIComponent(SUMMARY);
        window.location.href = `mailto:${BUSINESS_EMAIL}?subject=${subject}&body=${body}`;
      }
    })();
  })();
  </script>
</body>
</html>
